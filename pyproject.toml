[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baaboo-sso-auth"
version = "0.1.0"
description = "SSO authentication package for Python apps integrating with baaboo SSO (JWT, OAuth callback, /me, heartbeat)."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [
    { name = "Mohammed Asheek", email = "mohammed.asheek@baaboo.com" },
]
keywords = ["sso", "jwt", "oauth", "baaboo", "fastapi", "flask", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "starlette>=0.36",
]
flask = [
    "flask>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "flask>=3.0",
    "starlette>=0.36",
]

[project.urls]
Homepage = "https://github.com/asheek21-baaboo/python-auth-package"
Documentation = "https://github.com/asheek21-baaboo/python-auth-package#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/baaboo_sso_auth"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
